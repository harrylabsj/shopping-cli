services:
  shopping-api:
    build: .
    image: shopping-cli-api:3.0.0
    command:
      - shopping-cli-api
      - --db
      - /data/shopping-cli.sqlite
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    ports:
      - "${SHOPPING_API_BIND:-127.0.0.1}:${SHOPPING_API_PORT:-8765}:8765"
    environment:
      SHOPPING_DEPLOYMENT_PROFILE: "${SHOPPING_DEPLOYMENT_PROFILE:-production}"
      SHOPPING_API_HOST: "${SHOPPING_API_HOST:-0.0.0.0}"
      SHOPPING_API_PORT: "${SHOPPING_API_PORT:-8765}"
      SHOPPING_DB: "${SHOPPING_DB:-/data/shopping-cli.sqlite}"
      SHOPPING_PUBLIC_BASE_URL: "${SHOPPING_PUBLIC_BASE_URL:-}"
      SHOPPING_AGENT_STALE_TTL_SECONDS: "${SHOPPING_AGENT_STALE_TTL_SECONDS:-60}"
      SHOPPING_ADMIN_TOKEN: "${SHOPPING_ADMIN_TOKEN:?set SHOPPING_ADMIN_TOKEN before starting shopping-api}"
      SHOPPING_BUYER_BOOTSTRAP_TOKEN: "${SHOPPING_BUYER_BOOTSTRAP_TOKEN:?set SHOPPING_BUYER_BOOTSTRAP_TOKEN before starting shopping-api}"
      SHOPPING_CHANNEL_TOKENS: "${SHOPPING_CHANNEL_TOKENS:-}"
    volumes:
      - shopping_cli_api_data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  shopping-agent:
    profiles: ["agent"]
    build: .
    image: shopping-cli-api:3.0.0
    command:
      - shopping-cli
      - agent
      - run
      - --merchant
      - "${SHOPPING_AGENT_MERCHANT:?set SHOPPING_AGENT_MERCHANT before starting the agent profile}"
      - --api-url
      - http://shopping-api:8765
      - --interval
      - "${SHOPPING_AGENT_INTERVAL:-3}"
    environment:
      SHOPPING_AGENT_HOST: "${SHOPPING_AGENT_HOST:-docker-compose}"
      SHOPPING_AGENT_SESSION_ID: "${SHOPPING_AGENT_SESSION_ID:-merchant-worker}"
      SHOPPING_AGENT_TOKEN: "${SHOPPING_AGENT_TOKEN:?set SHOPPING_AGENT_TOKEN before starting the agent profile}"
      SHOPPING_ALLOW_INSECURE_HTTP: "true"
    depends_on:
      shopping-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shopping_cli_api_data:
