[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-cli"
version = "2.0.0"
description = "Standalone local-commerce AI consultation marketplace runtime"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
]

[project.scripts]
shopping-cli = "shopping_cli.cli:main"
shopping-cli-api = "shopping_cli.api.server:main"
shopping-cli-agent = "shopping_cli.agents.agent_cli:main"

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "pydantic>=2",
  "uvicorn>=0.27",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["shopping_cli"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
omit = ["shopping_cli/__main__.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shopping_cli*"]
